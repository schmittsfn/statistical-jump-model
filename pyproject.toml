[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "statistical-jump-model"
version = "0.1.0"
description = "Inspectable statistical jump model research implementation with reference tests"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
authors = [{name = "Stefan Schmitt"}]
dependencies = ['numpy==2.5.2', 'pandas==3.0.5', 'scipy==1.18.1', 'exchange-calendars==4.13.2', 'jumpmodels==0.1.1', 'numba==0.68.1', 'threadpoolctl==3.7.0']

[project.urls]
Repository = "https://github.com/schmittsfn/statistical-jump-model"
Issues = "https://github.com/schmittsfn/statistical-jump-model/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/statistical_jump_model"]
